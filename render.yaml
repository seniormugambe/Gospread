services:
  - type: web
    name: gospread-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health/
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 600 --threads 4
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: "https://gospread.onrender.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "gospread-api.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: AWS_IVS_REGION
        value: "us-east-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gospread.onrender.com,https://gospread-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gospread.onrender.com,https://gospread-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: PYTHON_VERSION
        value: "3.12.5"

  - type: web
    name: gospread
    runtime: static
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DJANGO_API_URL
        value: "https://gospread-api.onrender.com/api/v1"
